[package]
name = "frostsnap_sp_bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bitcoin.workspace = true
bincode.workspace = true
frostsnap_core = { workspace = true, features = ["coordinator"] }
frostsnap_coordinator.workspace = true
frostsnap_factory = { path = "../../frostsnap_factory" }
