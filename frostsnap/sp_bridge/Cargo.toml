rand.workspace = true
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
frostsnap_core = { workspace = true, features = ["test-util"] }
rand_chacha.workspace = true
